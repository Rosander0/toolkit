<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal File Toolkit</title>
  <meta name="description" content="Personal client-side file toolkit for images, PDFs, and Office documents." />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app" class="app-layout">
    <header class="app-header">
      <div class="header-container">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Personal File Toolkit</h1>
            <p class="brand-subtitle">Private &bull; Fast &bull; Client-side processing</p>
          </div>
        </div>

        <nav class="tool-nav" aria-label="Tool selection">
          <button class="nav-tab active" data-tool="image-converter" role="tab" aria-selected="true" aria-controls="view-image-converter">
            Image Converter
          </button>
          <button class="nav-tab" data-tool="pdf-tools" role="tab" aria-selected="false" aria-controls="view-pdf-tools">
            PDF Tools
          </button>
          <button class="nav-tab" data-tool="images-to-pdf" role="tab" aria-selected="false" aria-controls="view-images-to-pdf">
            Images &rarr; PDF
          </button>
          <button class="nav-tab" data-tool="pdf-to-images" role="tab" aria-selected="false" aria-controls="view-pdf-to-images">
            PDF &rarr; Images
          </button>
          <button class="nav-tab" data-tool="office-to-pdf" role="tab" aria-selected="false" aria-controls="view-office-to-pdf">
            Office &rarr; PDF
          </button>
        </nav>
      </div>
    </header>

    <main class="main-content" id="main-content">
      <div id="tool-container" class="tool-container">
        <!-- Tool views dynamically rendered or switched here -->
        <section id="view-image-converter" class="tool-view active" role="tabpanel" aria-labelledby="tab-image-converter"></section>
        <section id="view-pdf-tools" class="tool-view" role="tabpanel" aria-labelledby="tab-pdf-tools"></section>
        <section id="view-images-to-pdf" class="tool-view" role="tabpanel" aria-labelledby="tab-images-to-pdf"></section>
        <section id="view-pdf-to-images" class="tool-view" role="tabpanel" aria-labelledby="tab-pdf-to-images"></section>
        <section id="view-office-to-pdf" class="tool-view" role="tabpanel" aria-labelledby="tab-office-to-pdf"></section>
      </div>
    </main>

    <footer class="app-footer">
      <div class="footer-container">
        <span>Runs 100% locally in your browser for Image &amp; PDF operations.</span>
        <span>Zero tracking &bull; No cookies &bull; Single user</span>
      </div>
    </footer>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
